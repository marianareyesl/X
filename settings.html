<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - X</title>

    <style>
        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            max-width: 600px;
            margin: auto;
            background-color: black;
            border: 1px solid white;
        }

        .encabezado {
            padding: 20px;
            border-bottom: 1px solid white;
            font-size: 22px;
            font-weight: bold;
        }

        .formulario {
            padding: 20px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid white;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 15px;
            background-color: black;
            color: white;
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        .boton {
            width: 100%;
            padding: 12px;
            background-color: white;
            color: black;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton:hover {
            background-color: #ccc;
        }

        .mensaje {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: white;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="encabezado">
            ← Configuración
        </div>

        <div class="formulario">

            <h2>Editar perfil</h2>

            <p>Actualiza tus datos personales.</p>

            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" value="Ing. Mendoza">
            </div>

            <div class="campo">
                <label for="usuario">Nombre de usuario</label>
                <input type="text" id="usuario" value="@ing_dev">
            </div>

            <div class="campo">
                <label for="bio">Biografía</label>
                <textarea id="bio">Ingeniero de Software. Desarrollador apasionado por la tecnología y la programación.</textarea>
            </div>

            <div class="campo">
                <label for="ubicacion">Ubicación</label>
                <input type="text" id="ubicacion" value="México">
            </div>

            <div class="campo">
                <label for="sitio">Sitio web</label>
                <input type="text" id="sitio" placeholder="https://">
            </div>

            <button class="boton" onclick="guardar()">Guardar cambios</button>

            <div class="mensaje" id="mensaje"></div>

        </div>
    </div>

    <script>
        function guardar() {
            document.getElementById("mensaje").innerText =
                "¡Tus datos se han guardado correctamente!";
        }
    </script>

</body>
</html>
