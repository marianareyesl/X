<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Módulo Replies</title>
</head>
<body>

  <section class="vista-detalle">
    <article class="publicacion-principal">
      <h3>Nombre de Usuario (@usuario)</h3>
      <p>Este es el texto completo de la publicación que se está leyendo.</p>
      <small>Publicado hace 2 horas</small>
    </article>

    <form class="caja-respuesta">
      <textarea rows="3" placeholder="Escribe tu respuesta aquí..." required></textarea>
      <button type="submit">Responder</button>
    </form>

    <div class="lista-respuestas">
      <p><strong>@otro_usuario:</strong> ¡Muy buena publicación!</p>
    </div>
  </section>

</body>
</html>
