<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trends - X</title>
  <style>
    body { background: #000; color: #e7e9ea; font-family: system-ui, sans-serif; padding: 20px; }
    .trends-card {
      max-width: 350px; background: #16181c; border: 1px solid #2f3336;
      border-radius: 16px; overflow: hidden;
    }
    .trends-header { padding: 14px 16px; font-size: 20px; font-weight: 800; }
    .trend-item { padding: 12px 16px; border-top: 1px solid #2f3336; cursor: pointer; }
    .trend-item:hover { background: #1d1f23; }
    .trend-meta { font-size: 13px; color: #71767b; }
    .trend-title { font-size: 15px; font-weight: 700; margin: 2px 0; }
  </style>
</head>
<body>
  <aside class="trends-card">
    <div class="trends-header">Qué está pasando</div>
    <div class="trend-item">
      <div class="trend-meta">Tecnología · Tendencia</div>
      <div class="trend-title">#GitFlow</div>
      <div class="trend-meta">14.2 mil posts</div>
    </div>
    <div class="trend-item">
      <div class="trend-meta">Tendencia en México</div>
      <div class="trend-title">Ingeniería en Software</div>
      <div class="trend-meta">8,540 posts</div>
    </div>
    <div class="trend-item">
      <div class="trend-meta">Programación · Tendencia</div>
      <div class="trend-title">#HTML5</div>
      <div class="trend-meta">22.9 mil posts</div>
    </div>
    <div class="trend-item">
      <div class="trend-meta">Entretenimiento · Tendencia</div>
      <div class="trend-title">Nuevo diseño de X</div>
      <div class="trend-meta">5,120 posts</div>
    </div>
  </aside>
</body>
</html>
