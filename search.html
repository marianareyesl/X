<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - X</title>
  <style>
    body { background: #000; color: #e7e9ea; font-family: system-ui, sans-serif; padding: 20px; }
    .search-box { max-width: 350px; }
    .search-input {
      width: 100%; padding: 12px 16px; border-radius: 9999px;
      border: 1px solid #2f3336; background: #202327; color: #e7e9ea;
      font-size: 15px; outline: none; box-sizing: border-box;
    }
    .search-input:focus { border-color: #1d9bf0; background: #000; }
    .results {
      margin-top: 10px; background: #16181c; border: 1px solid #2f3336;
      border-radius: 16px; overflow: hidden;
    }
    .item { padding: 12px 16px; border-bottom: 1px solid #2f3336; }
    .item:last-child { border-bottom: none; }
    .tag { color: #1d9bf0; font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="search-box">
    <input type="text" id="buscador" class="search-input" placeholder="Buscar palabras clave, #hashtags o @usuarios...">
    <div id="resultados" class="results"></div>
  </div>

  <script>
    const datos = [
      { tipo: "Usuario", texto: "@marianareyesl - Mariana Reyes" },
      { tipo: "Usuario", texto: "@diego_ui - Diego" },
      { tipo: "Usuario", texto: "@enrique_dev - Enrique" },
      { tipo: "Hashtag", texto: "#DesarrolloWeb" },
      { tipo: "Hashtag", texto: "#IngenieriaSoftware" },
      { tipo: "Palabra clave", texto: "Proyecto colaborativo clon de X" }
    ];

    const input = document.getElementById("buscador");
    const contenedor = document.getElementById("resultados");

    function mostrar(filtro = "") {
      const filtrados = datos.filter(d => d.texto.toLowerCase().includes(filtro.toLowerCase()));
      contenedor.innerHTML = filtrados.length
        ? filtrados.map(d => `<div class="item"><div class="tag">${d.tipo}</div><div>${d.texto}</div></div>`).join("")
        : `<div class="item">Sin resultados para "${filtro}"</div>`;
    }

    input.addEventListener("input", e => mostrar(e.target.value));
    mostrar();
  </script>
</body>
</html>
