<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suggestions - X</title>
  <style>
    body { background: #000; color: #e7e9ea; font-family: system-ui, sans-serif; padding: 20px; }
    .suggestions-card {
      max-width: 350px; background: #16181c; border: 1px solid #2f3336;
      border-radius: 16px; overflow: hidden;
    }
    .card-header { padding: 14px 16px; font-size: 20px; font-weight: 800; }
    .user-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-top: 1px solid #2f3336;
    }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; background: #1d9bf0;
      display: flex; align-items: center; justify-content: center; font-weight: bold;
    }
    .name { font-weight: 700; font-size: 15px; }
    .handle { color: #71767b; font-size: 13px; }
    .follow-btn {
      background: #eff3f4; color: #0f1419; border: none; border-radius: 9999px;
      padding: 8px 16px; font-weight: 700; cursor: pointer;
    }
    .follow-btn.following {
      background: transparent; color: #eff3f4; border: 1px solid #536471;
    }
  </style>
</head>
<body>
  <aside class="suggestions-card">
    <div class="card-header">A quién seguir</div>
    <div class="user-row">
      <div class="user-info">
        <div class="avatar">M</div>
        <div><div class="name">Mariana Reyes</div><div class="handle">@marianareyesl</div></div>
      </div>
      <button class="follow-btn" onclick="toggleSeguir(this)">Seguir</button>
    </div>
    <div class="user-row">
      <div class="user-info">
        <div class="avatar">D</div>
        <div><div class="name">Diego</div><div class="handle">@diego_ui</div></div>
      </div>
      <button class="follow-btn" onclick="toggleSeguir(this)">Seguir</button>
    </div>
    <div class="user-row">
      <div class="user-info">
        <div class="avatar">R</div>
        <div><div class="name">Rosiely</div><div class="handle">@rosiely_dev</div></div>
      </div>
      <button class="follow-btn" onclick="toggleSeguir(this)">Seguir</button>
    </div>
    <div class="user-row">
      <div class="user-info">
        <div class="avatar">D</div>
        <div><div class="name">Daniela</div><div class="handle">@daniela_ux</div></div>
      </div>
      <button class="follow-btn" onclick="toggleSeguir(this)">Seguir</button>
    </div>
    <div class="user-row">
      <div class="user-info">
        <div class="avatar">E</div>
        <div><div class="name">Enrique</div><div class="handle">@enrique_dev</div></div>
      </div>
      <button class="follow-btn" onclick="toggleSeguir(this)">Seguir</button>
    </div>
  </aside>

  <script>
    function toggleSeguir(boton) {
      const siguiendo = boton.classList.toggle("following");
      boton.textContent = siguiendo ? "Siguiendo" : "Seguir";
    }
  </script>
</body>
</html>
